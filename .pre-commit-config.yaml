# `pre-commit install` registers both stages (see README-dev.md): fast checks
# at commit, the slow type-check and test suite at push.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:

  - repo: local
    hooks:
      - id: pyproject-fmt
        name: pyproject-fmt
        entry: uv run pyproject-fmt pyproject.toml
        language: system
        pass_filenames: false

      - id: uv-lock
        name: uv lock
        entry: uv lock
        language: system
        pass_filenames: false

      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi, jupyter]
        pass_filenames: true

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi, jupyter, markdown]
        pass_filenames: true

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        stages: [pre-push]

      # `--offline` is not a convenience here. The IDE switch (`OFFICE365_LIVE=1` in `.env`)
      # makes a plain `pytest` a live sweep of a real tenant, and a push gate that depends on
      # one is a gate that takes hours and fails for reasons the commit cannot fix.
      - id: pytest
        name: pytest
        entry: uv run pytest --offline
        language: system
        pass_filenames: false
        stages: [pre-push]
