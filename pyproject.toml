[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.9,<0.13" ]

[project]
name = "office365-rest-python-client"
version = "3.3.1"
description = "Microsoft 365 & Microsoft Graph Library for Python"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Domenico Di Nicola", email = "dom.dinicola@gmail.com" },
]
authors = [
  { name = "Vadim Gremyachev", email = "vvgrem@gmail.com" },
]
# The floor is measured, not preferred: models annotate "Type | None", and the
# declared type is resolved at runtime, so 3.9 failed on the first schema read and
# 3.8 fails to import at all (functools.cache).
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",

  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "msal>=1.28,<2",
  "pytz>=2021.1",
  "requests>=2.32.4,<3",
  "typing-extensions>=4.5",
  # The codebase uses "Self" and "Required" available in the typing module
  # since Python 3.11. Therefore, typing_extensions is required as long
  # as office365-rest-python-client supports Python versions < 3.11.
  # On Python versions >= 3.11, typing_extensions re-exports these names
  # from the standard library typing module.
]
optional-dependencies.azure = [
  "azure-storage-blob>=12.19",
  "cryptography>=42",
]
optional-dependencies.duckdb = [
  "duckdb>=1",
]
optional-dependencies.examples = [
  "faker",
  "tqdm>=4.60,<5",
]
optional-dependencies.excel = [
  "openpyxl>=3.1",
]
optional-dependencies.httpx = [
  "httpx>=0.27,<1",
]
optional-dependencies.notebooks = [
  "jinja2",
  "jupyter",
  "nbformat",
  "pandas>=1.3",
]
optional-dependencies.ntlm = [
  "requests-ntlm",
]
optional-dependencies.pandas = [
  "pandas>=1.5",
]
optional-dependencies.parquet = [
  "pyarrow>=14",
]
optional-dependencies.progress = [
  "tqdm>=4.60,<5",
]
optional-dependencies.sql = [
  "sqlalchemy>=2",
]
urls.funding = "https://ko-fi.com/vgrem"
urls.repository = "https://github.com/vgrem/office365-rest-python-client"

[dependency-groups]
dev = [
  "adal~=1.2.4",
  "cryptography>=44",
  "faker>=4.1.2,<40.42",
  "pre-commit>=4",
  "pyproject-fmt",
  "pyright>=1.1.408",
  "pytest",
  "pyyaml>=6,<7",
  # Ruff is pinned once, here, and installed from this lockfile in CI
  # (see .github/workflows/ci.yml), so local hooks and CI cannot drift.
  "ruff==0.16.10",
  "types-requests",
]
docs = [
  "mkdocs~=1.6",
  "mkdocs-awesome-pages-plugin~=2.9",
  "mkdocs-gen-files~=0.5",
  "mkdocs-material~=9.5",
  "mkdocstrings[python]>=0.28,<2",
  "pygments>=2.17",
]

[tool.uv]
# The lockfile resolves for >=3.11 while the package declares 3.10: two transitive
# pins (filelock, tornado) have no patched release for 3.10, so a lock that covered
# it would hold the unpatched versions forever. This changes nothing for consumers;
# the declared floor is exercised by the `floor` CI job, which installs by
# resolution instead of by lock. Remove this when the floor reaches 3.11.
environments = [ "python_full_version >= '3.11'" ]
build-backend.module-name = "office365"
build-backend.module-root = ""

[tool.ruff]
target-version = "py310"
line-length = 121
src = [ "examples", "generator", "office365", "tests" ]
format.line-ending = "lf"
format.docstring-code-format = true
lint.select = [
  "A",     # flake8-builtins
  "ASYNC", # flake8-async
  "B",     # bugbear
  #"D",     # pydocstyle
  "E",     # pycodestyle
  "F",     # pyflakes
  "I",     # isort
  #"PGH", # pygrep-hooks
  "PIE",   # flake8-pie
  "PL",    # pylint
  #"PTH", # flake8-pathlib
  "PYI",   # flake8-pyi
  #"RUF", # ruff
  #"UP",  # pyupgrade
  "W",     # pycodestyle
]
lint.ignore = [
  "B008",    # Do not perform function call in argument defaults
  "PLC0415", # `import` should be at the top-level of a file (circular import workaround)
]
lint.pylint.max-args = 50
lint.pylint.max-branches = 16
lint.pylint.max-statements = 60

[tool.pyright]
pythonVersion = "3.10"
# Third-party imports resolve from the project venv, so the optional extras have to
# be installed (`uv sync --all-extras`, see README-dev.md). A hardcoded
# `.venv/lib/python3.11/site-packages` used to sit here and pointed at nothing.
venv = ".venv"
venvPath = "."
include = [ "generator", "office365" ]
