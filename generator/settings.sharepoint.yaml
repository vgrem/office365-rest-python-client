# Generator settings for the sharepoint model (see generator/config.py).
metadata_path: ./metadata/SharePoint.xml
output_path: ../office365
context_type: ClientContext
generate_methods: true
include_base_types:
  - EntityType
  - ComplexType
namespace: SP
filters:
  ignored_types:
    - SP.ApiMetadata
    - SP.TypeInformation
    - SP.KeyValue
    - SP.PropertyInformation
    - SP.ParameterInformation
    - SP.MethodInformation
    - SP.WebRequestInfo
    - SP.WebResponseInfo
    - SP.ResourcePath
    - PS.*
    - Microsoft.SharePoint.QuickActionMessageCard.*
    - Microsoft.SharePoint.News.DataModel.*
    - Microsoft.SharePoint.KnowledgeSite.Models.*
    - Microsoft.SharePoint.MicroService.Notify.*
    - SP.WorkManagement.OM.*
    - OData__*
    - SP.Data.*
    - MS.FileServices.*
  ignored_properties:
    - Id4a81de82eeb94d6080ea5bf63e27023a
    # Declared on SecurableObject, which every list and web inherits, and the service
    # answers `$select` with 400 for it on both. It is answered for a list item, so the
    # one declaration lives there -- written by hand, which is why it survives a run.
    - ShieldAddRoleAssignmentPushdown
modules:
  - office365.sharepoint
routing:
  SP: office365.sharepoint
  Microsoft.Online.SharePoint: office365.sharepoint
  Microsoft.SharePoint.Client.Search.Query: office365.sharepoint.search.query
  Microsoft.Office.Server.ContentCenter: office365.sharepoint.contentcenter
  Microsoft.SharePoint.SmartWikiLibrary: office365.sharepoint.lists
  Microsoft.SharePoint.Administration.OdbLicenseEnforcement.Service: office365.sharepoint.tenant.administration
  Microsoft.SharePoint.ContentSolution.API: office365.sharepoint.contentcenter
  Microsoft.SharePoint.Internal.ClientSideComponent: office365.sharepoint
  Microsoft.SharePoint.QuotaManagement.Consumer.Merlin.QuotaInfo: office365.sharepoint.tenant.administration
  Microsoft.SharePoint.EmployeeEngagement: office365.sharepoint
  Microsoft.SharePoint.Administration.TenantAdmin.OdbMetricsAggregation: office365.sharepoint.tenant.administration
