  UserPFXCertificate*: office365.intune.devices.management
  ManagedEBook*: office365.intune.devices.management.managed.ebook
  # Enrolment: one directory, because the platform is the profile's subject and not its
  # home.  Narrower than the `Android*`/`Windows*` adjectives above, and it wins on order.
  AppleUserInitiatedEnrollment*: office365.intune.devices.enrollment
  AndroidDeviceOwnerEnrollment*: office365.intune.devices.enrollment
  AndroidForWorkEnrollment*: office365.intune.devices.enrollment
  AndroidForWorkSettings*: office365.intune.devices.enrollment
  DepOnboardingSetting*: office365.intune.devices.enrollment
  ImportedDeviceIdentit*: office365.intune.devices.enrollment
  # Reporting and RBAC families the generic rules miss.  Each one is a navigation of the
  # service root with no claim on a prefix, so without a rule it falls to `office365.common`:
  # a remote-audit entry is the audit log, a scope tag belongs beside the role definition it
  # scopes, and the per-device state records sit with the other `*State` types.
  RemoteActionAudit*: office365.intune.audit
  RoleScopeTag*: office365.intune.devices.management
  ComanagementEligibleDevice*: office365.intune.devices.management
  ManagedDeviceEncryptionState*: office365.intune.devices.management
  ManagedAllDeviceCertificateState*: office365.intune.devices.management
  RestrictedAppsViolation*: office365.intune.devices.compliance
  # App-management families: `Ios*` and `Windows*` land at the Intune root, so the ones that
  # belong to an app subtree say which.  A provisioning configuration is the iOS payload that
  # sits beside its assignment, the Windows app-protection family is one more `protections`
  # file *and* the three enums it reads, the Windows management agent is the per-device record
  # the service root exposes, and a WDAC supplemental policy is uploaded content, like the
  # code-signing certificates.
  IosLobAppProvisioningConfiguration*: office365.intune.devices.management.mobileapps.ios
  MobileAppProvisioningConfig*: office365.intune.devices.management.mobileapps.ios
  WindowsManagedApp*: office365.intune.devices.management.managed.app.protections
  WindowsManagementApp*: office365.intune.devices.management
  WindowsDefenderApplicationControlSupplementalPolicy*: office365.intune.devices.management
  # Entra types the Intune adjectives used to swallow.
  DeviceRegistrationPolicy: office365.directory.policies
  DevicesFilter: office365.directory.policies
  DeviceInfo: office365.directory.policies.conditionalaccess
  DeviceAndAppManagementAssignmentTarget: office365.directory.policies.conditionalaccess
  DeviceLocalCredential*: office365.directory
  WindowsSetting*: office365.directory.users
