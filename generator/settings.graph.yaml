  # The platform adjectives name a configuration *and* an app subtree, so they stay
  # coarse and the placement descent picks the family from the type name.
  Windows*: office365.intune
  Android*: office365.intune
  Ios*: office365.intune
  Mac*: office365.intune
  Oma*: office365.intune.devices.configurations
  # Device-management singletons no prefix claims: each one is a navigation of the
  # service root, so without a rule it would fall to `office365.common`.
  HardwarePassword*: office365.intune.devices.management
  CartToClassAssociation: office365.intune.devices.management
  CertificateConnectorDetails: office365.intune.devices.management
  ChromeOSOnboardingSettings: office365.intune.devices.management
